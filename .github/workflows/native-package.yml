name: Build Debian native package

on:
  workflow_dispatch:
    inputs:
      reviewed_dnscrypt:
        description: Include the reviewed combined DNSCrypt variant
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m venv .build/native-tools
      - run: .build/native-tools/bin/python -m pip install -r web/backend/requirements.txt -r integrated/tests/requirements.txt
      - run: .build/native-tools/bin/python -m pytest integrated/tests scripts/tests -q
      - run: .build/native-tools/bin/python scripts/export-api-contract.py --check
      - run: python scripts/build-integrated-ui.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: python packaging/components/mosdns_filter.py --output .build/mosdns-filter
      - run: .build/native-tools/bin/python scripts/test-dns-filter.py --mosdns .build/mosdns-filter/mosdns-filter
      - run: .build/native-tools/bin/python scripts/build-components.py --output .build/components-bundle
      - name: Build reviewed DNSCrypt variant
        if: inputs.reviewed_dnscrypt
        shell: bash
        run: |
          .build/native-tools/bin/python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          from urllib.request import urlopen

          lock = json.loads(Path('packaging/dnscrypt-source.lock.json').read_text())
          work = Path('.build/dnscrypt-source')
          work.mkdir()
          for name in ('source', 'toolchain'):
              with urlopen(lock[name]['url'], timeout=60) as response, (work / f'{name}.tar.gz').open('wb') as output:
                  shutil.copyfileobj(response, output)
          PY
          .build/native-tools/bin/python scripts/build-dnscrypt-source.py \
            --source-archive .build/dnscrypt-source/source.tar.gz \
            --toolchain-archive .build/dnscrypt-source/toolchain.tar.gz \
            --work .build/dnscrypt-source/build --variants combined
      - name: Build native package
        shell: bash
        env:
          REVIEWED_DNSCRYPT: ${{ inputs.reviewed_dnscrypt }}
        run: |
          extra=()
          if [[ "$REVIEWED_DNSCRYPT" == true ]]; then
            extra=(--dnscrypt-source-candidate .build/dnscrypt-source/build/combined)
          fi
          .build/native-tools/bin/python scripts/build-native-package.py \
            --components-bundle .build/components-bundle --mosdns-filter .build/mosdns-filter \
            --frontend-dist .build/integrated-web/dist --output .build/lovestdns-native-debian-amd64.tar.gz "${extra[@]}"
      - name: Verify distributable through the production installer
        shell: bash
        run: |
          digest=$(cut -d ' ' -f 1 .build/lovestdns-native-debian-amd64.tar.gz.sha256)
          python install.py --package .build/lovestdns-native-debian-amd64.tar.gz --sha256 "$digest" --download-only .build/verified-native
      - uses: actions/upload-artifact@v4
        with:
          name: lovestdns-native-debian-amd64
          path: .build/verified-native/*
          if-no-files-found: error

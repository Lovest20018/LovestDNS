name: Validate integrated edition (no publication)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'integrated/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'web/**'
      - 'docs/contracts/**'
      - 'docker-compose*.yaml'
      - '.gitignore'
      - '.gitattributes'
      - '.dockerignore'
      - '.env.integrated.example'
      - '.env.native.example'
      - 'install.py'
      - '.github/workflows/native-package.yml'
      - '.github/workflows/integrated-check.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/freeze-standalone.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r web/backend/requirements.txt -r integrated/tests/requirements.txt
      - run: python scripts/export-api-contract.py --check
      - run: python -m pytest integrated/tests scripts/tests -q
      - run: python -m pytest web/backend/tests -q
      - run: python scripts/build-integrated-ui.py
      - run: node --experimental-strip-types --test integrated/frontend/tests/*.test.ts
      - run: node --experimental-strip-types --test web/tests/*.test.ts
      - run: python scripts/build-components.py --output .build/components-bundle
      - run: python scripts/extract-component-baseline.py --output .build/core-baseline
      - run: python scripts/test-cache-compatibility.py --baseline-home .build/core-baseline --bundle .build/components-bundle --work .build/cache-compatibility
      - run: python scripts/test-dnscrypt-compatibility.py --baseline-home .build/core-baseline --bundle .build/components-bundle --work .build/dnscrypt-compatibility
      - run: docker build -f packaging/integrated/Dockerfile -t lovestdns:test .
      - run: python scripts/test-integrated-container.py --image lovestdns:test
